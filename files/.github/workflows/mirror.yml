name: Mirror to public
on:
  push:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --redact --no-color
      - name: Prepare SSH
        env:
          GH_DEPLOY_KEY: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$GH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "Host github.com\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config
      - name: Run mirror script
        env:
          PUBLIC_GH_SSH: git@github.com:seanyates76/Ez-Quiz-App.git
        run: |
          chmod +x scripts/mirror.sh
          scripts/mirror.sh