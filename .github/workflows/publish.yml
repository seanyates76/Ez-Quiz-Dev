name: Publish Mirror (Simple)

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: mirror-main
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Start SSH agent (deploy key)
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}

      - name: Trust github.com host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Prepare filtered contents
        run: |
          set -euo pipefail
          mkdir -p filtered
          RSYNC_EXCLUDES=("--exclude=.git/" "--exclude=.github/workflows/publish*.yml")
          if [ -f .publicignore ]; then RSYNC_EXCLUDES+=("--exclude-from=.publicignore"); fi
          rsync -a --delete "${RSYNC_EXCLUDES[@]}" ./ ./filtered/

      - name: Clone public repo via SSH
        run: |
          set -euo pipefail
          # Clone if exists; otherwise init
          if git ls-remote git@github.com:seanyates76/Ez-Quiz-App.git HEAD >/dev/null 2>&1; then
            git clone git@github.com:seanyates76/Ez-Quiz-App.git public-repo
          else
            mkdir -p public-repo
            cd public-repo
            git init
            git remote add origin git@github.com:seanyates76/Ez-Quiz-App.git
            git checkout -B main
          fi

      - name: Sync and push
        run: |
          set -euo pipefail
          cd public-repo
          # Ensure branch exists locally
          git fetch origin main || true
          git checkout -B main || git checkout -B main
          # Replace working tree with filtered files
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --delete --exclude=.git/ ../filtered/ ./
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish from private repo: ${GITHUB_SHA}"
          git push --force-with-lease origin HEAD:main
