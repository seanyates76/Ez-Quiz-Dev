name: recover async final fixes

on:
  push:
    branches:
      - feat/async-generation-jobs

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: feat/async-generation-jobs
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '25'
          cache: npm
      - name: Apply recovery patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {found}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          replace('netlify/functions/lib/asyncHttp.js', """function authorize(event) {
            const token = process.env.GENERATE_BEARER_TOKEN ? String(process.env.GENERATE_BEARER_TOKEN) : '';
            if (!token) return true;
            const h = event && event.headers || {};
            const raw = h.authorization || h.Authorization || '';
            if (!raw || typeof raw !== 'string') return false;
            const trimmed = raw.trim();
            if (!trimmed.toLowerCase().startsWith('bearer ')) return false;
            return trimmed.slice(7).trim() === token;
          }
""", """function bearerToken(event) {
            const h = event && event.headers || {};
            const raw = h.authorization || h.Authorization || '';
            if (!raw || typeof raw !== 'string') return '';
            const trimmed = raw.trim();
            if (!trimmed.toLowerCase().startsWith('bearer ')) return '';
            return trimmed.slice(7).trim();
          }

          function authorize(event) {
            const token = process.env.GENERATE_BEARER_TOKEN ? String(process.env.GENERATE_BEARER_TOKEN) : '';
            if (!token) return true;
            return bearerToken(event) === token;
          }
""")
          replace('netlify/functions/lib/asyncHttp.js', """module.exports = {
            authorize,
""", """module.exports = {
            authorize,
            bearerToken,
""")

          replace('netlify/functions/generate-quiz-start.js', "const cors = handleCors(event, ['POST']);", "const cors = handleCors(event, ['POST'], { requireAuth: false });")

          replace('netlify/functions/generate-quiz-status.js', """const { handleCors, reply } = require('./lib/asyncHttp.js');
          const { createGenerationJobStore, publicJobStatus, sanitizeJobId } = require('./lib/asyncJobStore.js');
""", """const { authorize, bearerToken, handleCors, reply, unauthorized } = require('./lib/asyncHttp.js');
          const {
            createGenerationJobStore,
            publicJobStatus,
            sanitizeJobId,
            workerTokenMatches,
          } = require('./lib/asyncJobStore.js');
""")
          replace('netlify/functions/generate-quiz-status.js', "const cors = handleCors(event, ['GET']);", "const cors = handleCors(event, ['GET'], { requireAuth: false });")
          replace('netlify/functions/generate-quiz-status.js', """  const job = await store.getJob(jobId);
            if (!job) return reply(404, { error: 'Job not found' }, cors.origin);
            const statusCode = job.status === 'expired' ? 410 : 200;
""", """  const job = await store.getJob(jobId);
            if (!job) return reply(404, { error: 'Job not found' }, cors.origin);
            if (!authorize(event) && !workerTokenMatches(job, bearerToken(event))) {
              return unauthorized(cors.origin);
            }
            const statusCode = job.status === 'expired' ? 410 : 200;
""")

          replace('netlify/functions/generate-quiz-stop.js', """const { handleCors, parseJsonBody, reply } = require('./lib/asyncHttp.js');
          const { createGenerationJobStore, publicJobStatus, sanitizeJobId } = require('./lib/asyncJobStore.js');
""", """const { authorize, bearerToken, handleCors, parseJsonBody, reply, unauthorized } = require('./lib/asyncHttp.js');
          const {
            createGenerationJobStore,
            publicJobStatus,
            sanitizeJobId,
            workerTokenMatches,
          } = require('./lib/asyncJobStore.js');
""")
          replace('netlify/functions/generate-quiz-stop.js', "const cors = handleCors(event, ['POST']);", "const cors = handleCors(event, ['POST'], { requireAuth: false });")
          replace('netlify/functions/generate-quiz-stop.js', """  const jobId = sanitizeJobId(payload && payload.jobId);
            if (!jobId) return reply(400, { error: 'Invalid jobId' }, cors.origin);

            const store = createGenerationJobStore({ event });
            const job = await store.stopJob(jobId);
""", """  const jobId = sanitizeJobId(payload && payload.jobId);
            if (!jobId) return reply(400, { error: 'Invalid jobId' }, cors.origin);

            const store = createGenerationJobStore({ event });
            const before = await store.getJob(jobId);
            if (!before) return reply(404, { error: 'Job not found' }, cors.origin);
            if (!authorize(event) && !workerTokenMatches(before, bearerToken(event))) {
              return unauthorized(cors.origin);
            }
            const job = await store.stopJob(jobId);
""")

          replace('netlify/functions/lib/asyncJobStore.js', """  const {
              workerLeaseId,
              workerLeaseExpiresAt,
              workerTokenHash,
              ...safeJob
            } = job || {};
""", """  const {
              workerLeaseId,
              workerLeaseExpiresAt,
              ...safeJob
            } = job || {};
""")

          replace('public/js/api.js', "export async function getAsyncGenerationStatus(jobId, { signal } = {}){", "export async function getAsyncGenerationStatus(jobId, { signal, workerToken } = {}){")
          replace('public/js/api.js', """  const res = await fetch(url, {
              method: 'GET',
              headers: { 'Accept': 'application/json' },
              signal,
            });
""", """  const capability = String(workerToken || '').trim();
            const headers = { 'Accept': 'application/json' };
            if(capability) headers.Authorization = `Bearer ${capability}`;
            const res = await fetch(url, {
              method: 'GET',
              headers,
              signal,
            });
""")
          replace('public/js/api.js', "export async function stopAsyncGeneration(jobId, { signal } = {}){", "export async function stopAsyncGeneration(jobId, { signal, workerToken } = {}){")
          replace('public/js/api.js', """      const res = await fetch(endpoints[i], {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jobId }),
                signal,
              });
""", """      const capability = String(workerToken || '').trim();
              const headers = { 'Content-Type': 'application/json' };
              if(capability) headers.Authorization = `Bearer ${capability}`;
              const res = await fetch(endpoints[i], {
                method: 'POST',
                headers,
                body: JSON.stringify({ jobId }),
                signal,
              });
""")

          replace('public/js/generator.js', "request = Promise.resolve(stopAsyncGeneration(session.jobId));", "request = Promise.resolve(stopAsyncGeneration(session.jobId, { workerToken: session.workerToken }));")
          replace('public/js/generator.js', "status = await getAsyncGenerationStatus(session.jobId, { signal: session.controller.signal });", "status = await getAsyncGenerationStatus(session.jobId, { signal: session.controller.signal, workerToken: session.workerToken });")
          replace('public/js/generator.js', """  async function runAsyncGenerationJob(session, payload, types){
""", """  async function triggerAsyncGenerationWithRetry(session){
            const maxAttempts = 3;
            let lastResult = null;
            for(let attempt = 1; attempt <= maxAttempts; attempt += 1){
              if(!isActiveGeneration(session.id)) throw generationAbortError();
              lastResult = await triggerAsyncGeneration(session.jobId, session.workerToken);
              if(lastResult && lastResult.sent !== false) return lastResult;
              if(attempt < maxAttempts){
                await new Promise((resolve) => setTimeout(resolve, attempt * 400));
              }
            }
            const err = new Error('Could not start background generation. Trying the standard path.');
            err.name = 'AsyncGenerationKickoffError';
            err.asyncStartFailed = true;
            err.kickoffResult = lastResult;
            throw err;
          }

            async function runAsyncGenerationJob(session, payload, types){
""")
          replace('public/js/generator.js', """      triggerAsyncGeneration(session.jobId, session.workerToken).then((result) => {
                if(result && result.sent === false) {
                  try{ console.debug('[ezq:async-generation] worker trigger failed', result); }catch{}
                }
              });
""", """      try{
                await triggerAsyncGenerationWithRetry(session);
              }catch(err){
                try{ await requestAsyncGenerationStop(session); }catch{}
                throw err;
              }
""")

          replace('netlify/functions/lib/asyncGenerationWorker.js', """  const questionType = normalizeQuestionType(batch && batch.questionType || (Array.isArray(batch && batch.types) && batch.types[0]));
""", """  const questionType = batch && batch.questionType
              ? normalizeQuestionType(batch.questionType, '')
              : '';
""")

          for path in ['public/index.html', 'public/js/main.js']:
              p = Path(path)
              text = p.read_text()
              if '1.5.42' not in text:
                  raise SystemExit(f'{path}: cache version not found')
              p.write_text(text.replace('1.5.42', '1.5.43'))
          replace('public/sw.js', "const ASSET_VERSION = '1.5.42';", "const ASSET_VERSION = '1.5.43';")
          replace('public/sw.js', "const CACHE_NAME = 'ezq-v1226';", "const CACHE_NAME = 'ezq-v1227';")

          Path('netlify/functions/__tests__/async-recovery.test.js').write_text(r'''\
          'use strict';

          const fs = require('node:fs/promises');
          const os = require('node:os');
          const path = require('node:path');
          const { clearRateLimit } = require('../lib/generationRateLimit.js');
          const { buildPlannedBatches } = require('../lib/asyncGenerationPlanner.js');
          const { createGenerationJobStore } = require('../lib/asyncJobStore.js');
          const { processGenerationJob } = require('../lib/asyncGenerationWorker.js');

          function event(httpMethod, body, headers = {}, queryStringParameters = {}) {
            return { httpMethod, body: body == null ? undefined : JSON.stringify(body), headers, queryStringParameters };
          }

          describe('async recovery regressions', () => {
            let dir;
            const originalEnv = { ...process.env };

            beforeEach(async () => {
              dir = await fs.mkdtemp(path.join(os.tmpdir(), 'ezq-async-recovery-'));
              process.env.NODE_ENV = 'test';
              process.env.ASYNC_GENERATION_JOB_DIR = dir;
              process.env.GENERATE_BEARER_TOKEN = 'server-only-secret';
              process.env.AI_PROVIDER = 'echo';
              clearRateLimit();
            });

            afterEach(async () => {
              process.env = { ...originalEnv };
              clearRateLimit();
              await fs.rm(dir, { recursive: true, force: true });
              jest.resetModules();
            });

            test('browser capability can start, poll, stop, and poll a protected job', async () => {
              const start = require('../generate-quiz-start.js');
              const status = require('../generate-quiz-status.js');
              const stop = require('../generate-quiz-stop.js');
              const started = await start.handler(event('POST', { topic: 'Recovery', count: 5, provider: 'echo' }));
              expect(started.statusCode).toBe(202);
              const body = JSON.parse(started.body);
              expect(body.workerToken).toBeTruthy();

              const denied = await status.handler(event('GET', null, {}, { jobId: body.jobId }));
              expect(denied.statusCode).toBe(401);

              const auth = { authorization: `Bearer ${body.workerToken}` };
              const polled = await status.handler(event('GET', null, auth, { jobId: body.jobId }));
              expect(polled.statusCode).toBe(200);

              const stopped = await stop.handler(event('POST', { jobId: body.jobId }, auth));
              expect(stopped.statusCode).toBe(200);
              expect(JSON.parse(stopped.body).status).toBe('stopped');

              const terminal = await status.handler(event('GET', null, auth, { jobId: body.jobId }));
              expect(terminal.statusCode).toBe(200);
              expect(JSON.parse(terminal.body).status).toBe('stopped');
            });

            test('topic-only async jobs preserve explicitly selected question types', async () => {
              delete process.env.GENERATE_BEARER_TOKEN;
              const store = createGenerationJobStore({ env: process.env, dir });
              const plannedBatches = buildPlannedBatches({ topic: 'Ports', count: 5, types: ['YN'] });
              const job = await store.createJob({
                topic: 'Ports',
                requestedCount: 5,
                options: { topic: 'Ports', count: 5, types: ['YN'], provider: 'echo' },
                plannedBatches,
              });
              const result = await processGenerationJob(job.jobId, { store, workerId: 'worker-recovery-test' });
              expect(result.status).toBe('complete');
              expect(result.questions).toHaveLength(5);
              expect(result.questions.every((line) => line.startsWith('YN|'))).toBe(true);
            });

            test('browser kickoff uses bounded retries before sync fallback', async () => {
              const source = await fs.readFile(path.join(process.cwd(), 'public/js/generator.js'), 'utf8');
              expect(source).toContain('const maxAttempts = 3;');
              expect(source).toContain("err.name = 'AsyncGenerationKickoffError';");
              expect(source).toContain('await requestAsyncGenerationStop(session);');
            });
          });
          ''')
          PY
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: UI check
        run: npm run ui:check
      - name: Diff check
        run: git diff --check
      - name: Commit recovery
        shell: bash
        run: |
          rm .github/workflows/recover-async-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/lib/asyncHttp.js \
            netlify/functions/generate-quiz-start.js \
            netlify/functions/generate-quiz-status.js \
            netlify/functions/generate-quiz-stop.js \
            netlify/functions/lib/asyncJobStore.js \
            netlify/functions/lib/asyncGenerationWorker.js \
            netlify/functions/__tests__/async-recovery.test.js \
            public/js/api.js public/js/generator.js public/js/main.js \
            public/index.html public/sw.js \
            .github/workflows/recover-async-final.yml
          git commit -m "fix(generator): finish async release hardening"
          git push origin HEAD:feat/async-generation-jobs
