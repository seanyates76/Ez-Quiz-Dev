name: Dependency Review

on:
  pull_request:
    branches: [ "main", "beta" ]

permissions: {}

jobs:
  review:
    if: ${{ github.repository_visibility == 'public' }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@1e966ba708e4b64bb0c9bfb7abb5a232840be16a # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
