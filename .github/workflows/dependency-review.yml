name: Dependency Review

on:
  pull_request:
    branches: [ "main", "beta" ]

permissions: {}

jobs:
  review:
    if: ${{ github.repository_visibility == 'public' }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@dcd589ca9f7a6ded22e224ca2e288beb6bf9846b # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
