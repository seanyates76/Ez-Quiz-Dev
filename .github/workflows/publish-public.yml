name: Publish Public Mirror (legacy)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-to-public:
    permissions:
      contents: read
    env:
      PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
    name: Sync to Ez-Quiz-App
    runs-on: ubuntu-latest
    steps:
      - name: Detect deploy key presence
        id: detect
        shell: bash
        run: |
          if [ -n "${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}" ]; then
            echo "key=1" >> "$GITHUB_OUTPUT"
          else
            echo "key=0" >> "$GITHUB_OUTPUT"
          fi
      # Optional: load SSH deploy key if provided
      - name: Start SSH agent (deploy key)
        if: ${{ steps.detect.outputs.key == '1' }}
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}

      - name: Checkout private repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Checkout the public repo using SSH if deploy key is present
      - name: Checkout public repo (SSH)
        if: ${{ steps.detect.outputs.key == '1' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
        with:
          repository: seanyates76/Ez-Quiz-App
          path: public-repo
          ssh-key: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
          fetch-depth: 0

      # Otherwise checkout via HTTPS (read-only); push will use PAT later
      - name: Checkout public repo (HTTPS)
        if: ${{ steps.detect.outputs.key == '0' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
        with:
          repository: seanyates76/Ez-Quiz-App
          path: public-repo
          fetch-depth: 0

      - name: Prepare filtered contents
        run: |
          set -euo pipefail
          # Create a working directory with only the files we want to publish
          mkdir -p filtered
          # Use rsync to copy everything except ignored patterns and VCS files
          RSYNC_EXCLUDES=(
            "--exclude=.git/"
            "--exclude=.github/workflows/publish-public.yml"
          )
          if [ -f .publicignore ]; then
            RSYNC_EXCLUDES+=("--exclude-from=.publicignore")
          fi
          rsync -a --delete "${RSYNC_EXCLUDES[@]}" ./ ./filtered/

      - name: Update public repo working tree
        run: |
          set -euo pipefail
          # Keep the public repo's .git dir, wipe tracked contents
          find public-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          # Copy filtered files into the public repo
          rsync -a --delete --exclude=.git/ filtered/ public-repo/

      - name: Commit and push changes
        id: sync
        working-directory: public-repo
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          SYNC_BRANCH: mirror/main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ~/.ssh && ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          # Prefer SSH if deploy key is present; otherwise use HTTPS with token
          if [ "${{ steps.detect.outputs.key }}" = "1" ]; then
            git remote set-url origin git@github.com:seanyates76/Ez-Quiz-App.git
          else
            if [ -z "${PUBLIC_REPO_TOKEN:-}" ]; then
              echo "No deploy key and no PUBLIC_REPO_TOKEN provided." >&2
              exit 2
            fi
            git remote set-url origin "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/seanyates76/Ez-Quiz-App.git"
          fi
          SYNC_BRANCH="${SYNC_BRANCH:-main}"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish from private repo: ${GITHUB_SHA}"
          COMMIT_SHA=$(git rev-parse HEAD)
          FETCHED=0
          if git fetch origin "$SYNC_BRANCH"; then
            FETCHED=1
          else
            echo "Fetch of origin/$SYNC_BRANCH failed; proceeding with local branch." >&2
          fi
          if [ "$FETCHED" -eq 1 ]; then
            git checkout -B "$SYNC_BRANCH" "origin/$SYNC_BRANCH"
          else
            git checkout -B "$SYNC_BRANCH"
          fi
          git reset --hard "$COMMIT_SHA"
          git push --force-with-lease origin "$SYNC_BRANCH" || {
            if [ -n "${PUBLIC_REPO_TOKEN:-}" ]; then
              echo "Primary push failed; retrying with HTTPS token..."
              git remote set-url origin "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/seanyates76/Ez-Quiz-App.git"
              git push --force-with-lease origin "$SYNC_BRANCH"
            else
              echo "Push failed and no HTTPS token provided." >&2
              exit 1
            fi
          }
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: ${{ env.PUBLIC_REPO_TOKEN != '' && steps.sync.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          SYNC_BRANCH: mirror/main
        run: |
          set -euo pipefail
          cd public-repo
          PR_TITLE="Mirror: ${GITHUB_SHA:0:12} → main"
          printf -v PR_BODY '%s\n\n- Source commit: %s\n- Workflow run: %s/%s/actions/runs/%s' \
            'Automated mirror update from `seanyates76/Ez-Quiz-Dev`.' \
            "${GITHUB_SHA}" \
            "${GITHUB_SERVER_URL}" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_RUN_ID}"

          if gh pr view --repo seanyates76/Ez-Quiz-App --head "$SYNC_BRANCH" >/dev/null 2>&1; then
            PR_NUMBER=$(gh pr view --repo seanyates76/Ez-Quiz-App --head "$SYNC_BRANCH" --json number -q '.number')
            gh pr edit "$PR_NUMBER" --repo seanyates76/Ez-Quiz-App --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create --repo seanyates76/Ez-Quiz-App --base main --head "$SYNC_BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
          fi

      - name: Require PUBLIC_REPO_TOKEN for PR creation
        if: ${{ env.PUBLIC_REPO_TOKEN == '' && steps.sync.outputs.has_changes == 'true' }}
        run: |
          echo "PUBLIC_REPO_TOKEN is required to open the mirror pull request." >&2
          exit 1
