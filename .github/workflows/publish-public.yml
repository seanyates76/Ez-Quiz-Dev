name: Publish Public Mirror (legacy)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-to-public:
    name: Sync to Ez-Quiz-App
    runs-on: ubuntu-latest
    steps:
      - name: Detect deploy key presence
        id: detect
        shell: bash
        run: |
          if [ -n "${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}" ]; then
            echo "key=1" >> "$GITHUB_OUTPUT"
          else
            echo "key=0" >> "$GITHUB_OUTPUT"
          fi
      # Optional: load SSH deploy key if provided
      - name: Start SSH agent (deploy key)
        if: ${{ steps.detect.outputs.key == '1' }}
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checkout the public repo using SSH if deploy key is present
      - name: Checkout public repo (SSH)
        if: ${{ steps.detect.outputs.key == '1' }}
        uses: actions/checkout@v4
        with:
          repository: seanyates76/Ez-Quiz-App
          path: public-repo
          ssh-key: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
          fetch-depth: 0

      # Otherwise checkout via HTTPS (read-only); push will use PAT later
      - name: Checkout public repo (HTTPS)
        if: ${{ steps.detect.outputs.key == '0' }}
        uses: actions/checkout@v4
        with:
          repository: seanyates76/Ez-Quiz-App
          path: public-repo
          fetch-depth: 0

      - name: Prepare filtered contents
        run: |
          set -euo pipefail
          # Create a working directory with only the files we want to publish
          mkdir -p filtered
          # Use rsync to copy everything except ignored patterns and VCS files
          RSYNC_EXCLUDES=(
            "--exclude=.git/"
            "--exclude=.github/workflows/publish-public.yml"
          )
          if [ -f .publicignore ]; then
            RSYNC_EXCLUDES+=("--exclude-from=.publicignore")
          fi
          rsync -a --delete "${RSYNC_EXCLUDES[@]}" ./ ./filtered/

      - name: Update public repo working tree
        run: |
          set -euo pipefail
          # Keep the public repo's .git dir, wipe tracked contents
          find public-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          # Copy filtered files into the public repo
          rsync -a --delete --exclude=.git/ filtered/ public-repo/

      - name: Commit and push changes
        working-directory: public-repo
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ~/.ssh && ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          # Prefer SSH if deploy key is present; otherwise use HTTPS with token
          if [ "${{ steps.detect.outputs.key }}" = "1" ]; then
            git remote set-url origin git@github.com:seanyates76/Ez-Quiz-App.git
          else
            if [ -z "${PUBLIC_REPO_TOKEN:-}" ]; then
              echo "No deploy key and no PUBLIC_REPO_TOKEN provided." >&2
              exit 2
            fi
            git remote set-url origin "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/seanyates76/Ez-Quiz-App.git"
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish from private repo: ${GITHUB_SHA}"
          # Ensure main exists and push
          if ! git rev-parse --verify main >/dev/null 2>&1; then
            git branch -M main
          fi
          # Try push (force-with-lease for mirror semantics); if SSH fails and a token is available, fall back to HTTPS
          if ! git push --force-with-lease origin HEAD:main; then
            if [ -n "${PUBLIC_REPO_TOKEN:-}" ]; then
              echo "SSH push failed; falling back to HTTPS token..."
              git remote set-url origin "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/seanyates76/Ez-Quiz-App.git"
              git push --force-with-lease origin HEAD:main
            else
              echo "Push failed and no HTTPS token provided." >&2
              exit 1
            fi
          fi
