[build]
  publish = "public"
  # Skip builds if no meaningful runtime paths changed. A stale production
  # cache may reference a commit outside the current shallow checkout; in that
  # case return 1 so Netlify performs a clean build instead of failing early.
  ignore = "if git cat-file -e \"$CACHED_COMMIT_REF^{commit}\" 2>/dev/null && git cat-file -e \"$COMMIT_REF^{commit}\" 2>/dev/null; then git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- public/ src/ netlify/functions/ package*.json netlify.toml; else exit 1; fi"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@google/generative-ai", "@netlify/blobs", "nodemailer"]

# Edge Functions
[[edge_functions]]
  function = "beta"
  path = "/beta"

# ---------- Environments ----------
# Production (main)
[context.production]
  environment = { EZQ_ENV = "production" }

# Staging / second production (beta)
[context."branch:beta"]
  environment = { EZQ_ENV = "staging", FEATURE_FLAGS = "true" }

# MCP implementation branch
[context."branch:mcp-implementation"]
  environment = { QUIZ_RESPONSE = "v2", FEATURE_FLAGS = "true" }

# ---------- Security Headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Keep CSP minimal; update if adding external origins.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.buymeacoffee.com; font-src 'self' data:; connect-src 'self' https://ez-quiz.netlify.app https://eq-quiz.netlify.app https://ezquiz.dev https://cdn.buymeacoffee.com https://app.netlify.com; frame-src 'self' https://app.netlify.com;"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.tokens.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.backdrop.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------- Redirects / Functions ----------
[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate-quiz"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Optional: expose a tidy API path for MCP (keeps UI code simple)
[[redirects]]
  from = "/api/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# Stable public MCP endpoint used by the ChatGPT plugin submission.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# OpenAI Apps submission domain verification. Configure the portal-provided
# value as OPENAI_APPS_CHALLENGE in Netlify before requesting verification.
[[redirects]]
  from = "/.well-known/openai-apps-challenge"
  to = "/.netlify/functions/openai-apps-challenge"
  status = 200
  force = true

# SPA fallback. Note: Edge Functions run before redirects,
# so /beta is handled by the edge function and won't be swallowed by this.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
